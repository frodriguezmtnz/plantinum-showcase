name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow never needs write access to the repo.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platinum_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platinum_ci
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platinum_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platinum_ci
      NEXTAUTH_URL: http://localhost:9002
      NEXTAUTH_SECRET: ci-only-secret
      AUTH_SECRET: ci-only-secret
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:9002
      EMAIL_TRANSPORT: console

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platinum_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platinum_ci
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platinum_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platinum_ci
      NEXTAUTH_URL: http://localhost:9002
      NEXTAUTH_SECRET: ci-only-secret
      AUTH_SECRET: ci-only-secret
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:9002
      EMAIL_TRANSPORT: console
      E2E_EMAIL: e2e@platinum-showcase.test
      E2E_PASSWORD: PwTest12345!
      E2E_2FA_EMAIL: e2e-2fa@platinum-showcase.test
      E2E_2FA_PASSWORD: PwTest12345!
      E2E_2FA_USERNAME: e2e-2fa
      # CI-only 32-byte key so enabling 2FA works during the E2E run.
      TOTP_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      # Production builds now refuse to rate-limit without Upstash configured
      # (per-process counters are unsafe on serverless). Point E2E at an
      # unreachable endpoint so it exercises the outage fallback (in-memory,
      # like a Redis outage) instead of the fail-fast path.
      UPSTASH_REDIS_REST_URL: http://127.0.0.1:1
      UPSTASH_REDIS_REST_TOKEN: ci-e2e-only
      PW_CHANNEL: chromium

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - name: Seed E2E fixtures
        run: pnpm tsx scripts/e2e/seed.ts

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Configure apt retries
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries

      - name: Install Playwright browser
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            pnpm exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt ${attempt}/3); retrying in 20s..."
            sleep 20
          done
          echo "playwright install failed after 3 attempts"
          exit 1

      - name: Build
        run: pnpm build

      - name: E2E tests
        run: pnpm test:e2e
        env:
          E2E_SERVER_COMMAND: pnpm exec next start -p 9002
